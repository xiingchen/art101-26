<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Environment 01</title>
<link href="env05.css" rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="env05.js" defer></script>

</head>
<body>

  <div class="lyrics">
    <p>I feel like everybody's singing out of tune</p>
    <p>I feel like I can't help but always be so blue</p>
    <p>But in the end, I know I must keep pulling through</p>
    <p>And brace myself for all the hell-like petals on the moon</p>
  </div>

<img id="star" src="../exercises/images/star.webp" alt="star" title="star">

<img id="play-button"
     src="../exercises/images/play.png"
     width="100">

<img id="forward-button"
     src="../exercises/images/forward.png"
     width="100">
     
<img id="back-button"
     src="../exercises/images/back.png"
     width="100">

<div id="song-display">
    <h2 id="song-title"></h2>
    <p id="song-artist"></p>

    <button id="fact-button">ⓘ Song Info</button>

    <div id="fact-box">
        <p id="song-fact"></p>
    </div>
</div>

<button id="what-button">Guess what?</button>

<div id="output"></div>

</body>
</html>
